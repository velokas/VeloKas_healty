services:
  mysql:
    image: mysql:8.0
    container_name: fitnes-mysql-app
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ganti-root-password}
      MYSQL_DATABASE: fitnes_sehat
      MYSQL_USER: forma
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ganti-password-forma}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: fitnes-web-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://forma:${MYSQL_PASSWORD:-ganti-password-forma}@mysql:3306/fitnes_sehat
      AUTH_SECRET: ${AUTH_SECRET:-ganti-secret-panjang}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    command: sh -c "pnpm prisma migrate deploy && pnpm start"

volumes:
  mysql-data:
